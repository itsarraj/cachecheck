[package]
name = "cachecheck"
version = "0.1.0"
edition = "2021"
description = "Audits a live URL's HTTP caching headers for common misconfigurations"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/cachecheck"
readme = "README.md"
keywords = ["http", "cache-control", "etag", "cli", "web"]
categories = ["command-line-utilities"]

[lib]
name = "cachecheck"
path = "src/lib.rs"

[[bin]]
name = "cachecheck"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
httpdate = "1"
